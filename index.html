<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Earth Jukebox</title>
<meta name="description" content="Hear NASA's pictures of a changing Earth. Six years of lightning, one click per flash. Twelve years of city lights, read as a waveform.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23e1ffec' stroke-width='2'/%3E%3Cpath d='M16 16L16 5' stroke='%2350ff96' stroke-width='2'/%3E%3C/svg%3E">
<script type="module" src="js/app.js"></script>
</head>
<body>
<canvas id="scope" aria-hidden="true"></canvas>
<canvas id="cabinet" aria-hidden="true" hidden></canvas>
<button id="start" type="button" class="start" hidden>Tap to start</button>

<header>
  <div class="bar">
    <h1 id="heading"><button id="home" type="button" class="label" aria-label="Earth Jukebox. Menu.">Earth Jukebox</button></h1>
    <nav aria-label="Tools">
      <button id="ring" type="button" class="btn" aria-pressed="false" hidden>Chord</button>
      <button id="nasa" type="button" class="btn" aria-pressed="false" hidden>NASA</button>
      <button id="wav" type="button" class="btn" hidden>WAV</button>
      <button id="info" type="button" class="btn" aria-haspopup="dialog">Info</button>
    </nav>
  </div>
  <nav id="tabs" class="tabs" aria-label="Worlds" hidden></nav>
</header>

<main id="hub" class="hub" aria-label="Worlds"></main>

<main id="player" class="player" hidden>
  <p id="intro" class="sr-only"></p>
  <div id="globe" class="globe" role="application" tabindex="0" aria-describedby="intro" aria-label="Globe. Arrow keys turn it."></div>
  <button id="play" type="button" class="btn play">Play</button>
  <div class="rows">
    <label class="row"><span id="date" class="value">&nbsp;</span>
      <input id="time" type="range" min="0" max="1000" step="1" value="0" aria-label="Date"></label>
    <label class="row"><span id="speedv" class="value">&nbsp;</span>
      <input id="speed" type="range" min="0" max="1000" step="1" value="0" aria-label="Speed"></label>
  </div>
  <a id="download" class="btn download" hidden></a>
</main>
<figure id="frame" class="frame" hidden>
  <video id="nasavid" muted playsinline preload="auto" aria-label="NASA's original animation, at the same moment"></video>
  <figcaption><a id="framesrc" href="#" target="_blank" rel="noopener"></a></figcaption>
</figure>
<p id="status" class="status" role="status"></p>

<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<dialog id="about" aria-labelledby="about-h">
  <button id="close" type="button" class="btn close" aria-label="Close">Close</button>
  <h2 id="about-h" class="title small"></h2>
  <div id="about-body"></div>
  <dl id="keys" class="keys"></dl>
  <p id="credit" class="fine"></p>
  <p class="fine">Made for the NASA Space Apps Challenge 2026. NASA does not endorse this project.</p>
</dialog>
</body>
</html>
