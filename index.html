<body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="scope" aria-hidden="true"></canvas>
<button id="start" type="button" class="start" hidden>Tap to start</button>

<header>
  <div class="bar">
    <h1 id="heading"><button id="home" type="button" class="label" aria-label="Earth Jukebox. Menu.">Earth Jukebox</button></h1>
    <nav aria-label="Tools">
      <button id="play" type="button" class="btn" hidden>Play</button>
      <button id="wav" type="button" class="btn" hidden>Export audio</button>
      <button id="info" type="button" class="btn" aria-haspopup="dialog">Info</button>
    </nav>
  </div>
  <nav id="tabs" class="tabs" aria-label="Worlds" hidden></nav>
</header>

<main id="hub" class="hub" aria-label="Worlds" hidden></main>

<main id="player" class="player" hidden>
  <p id="intro" class="sr-only"></p>
  <div id="globe" class="globe" role="application" tabindex="0" aria-describedby="intro" aria-label="Globe. Arrow keys turn it."></div>
  <div class="rows">
    <label class="row"><span id="date" class="value">&nbsp;</span>
      <input id="time" type="range" min="0" max="1000" step="1" value="0" aria-label="Date"></label>
  </div>
  <a id="download" class="sr-only" tabindex="-1" aria-hidden="true"></a>
  <figure id="frame" class="frame" hidden>
    <button id="framebtn" type="button" aria-expanded="false" aria-label="NASA's original animation, at the same moment. Enlarge."><video id="nasavid" muted playsinline preload="auto"></video></button>
    <figcaption><a id="framesrc" href="#" target="_blank" rel="noopener"></a></figcaption>
  </figure>
</main>

<p id="status" class="status" role="status"></p>

<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>

<dialog id="about" aria-labelledby="about-h">
  <button id="close" type="button" class="btn close" aria-label="Close">Close</button>
  <h2 id="about-h" class="title small"></h2>
  <div id="about-body"></div>
  <dl id="keys" class="keys"></dl>
  <p id="credit" class="fine"></p>
  <p class="fine">Made for the NASA Space Apps Challenge 2026. NASA does not endorse this project.</p>
</dialog>
</body>
</html>
